name: Песочница на Vercel

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "primery/**", "package.json", "vercel.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Тесты
        run: npm ci && npm test
      - name: Выкладка на Vercel (если задан секрет VERCEL_TOKEN)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Секрет VERCEL_TOKEN не задан — песочница не выкладывается. См. README, раздел «Песочница»."
            exit 0
          fi
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
